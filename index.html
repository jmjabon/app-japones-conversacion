<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover es vital para que la app abrace el notch y la Dynamic Island en iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KikuNihongo - Práctica Auditiva</title>
  
  <!-- Optimización iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- status-bar-style en 'black-translucent' permite que la app ocupe toda la pantalla tras la barra de estado -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KikuNihongo">
  
  <!-- Icono PWA -->
  <link rel="apple-touch-icon" href="./media/icon-listening.jpg">
  <link rel="icon" type="image/jpg" href="./media/icon-listening.jpg">
  <link rel="manifest" href="./manifest.json">

  <!-- Aceleración de CDNs -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://unpkg.com">

  <!-- Tailwind CSS y Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.284.0"></script>

  <style>
    /* Ajustes Nativos iOS */
    body {
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      /* Ocultar scrollbars para estética nativa, manteniendo funcionalidad */
      scrollbar-width: none; 
    }
    body::-webkit-scrollbar {
      display: none;
    }
    
    ruby { ruby-position: over; }
    rt {
      font-size: 0.65em;
      color: #e11d48;
      font-weight: 600;
      user-select: none;
    }
    .hide-furigana rt { display: none; }
    .hide-translation .dialogue-translation { display: none; }

    /* Sombras suaves estilo Apple */
    .ios-shadow {
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    }
    .ios-card-shadow {
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
    }
  </style>
</head>

<!-- Uso de 100dvh para evitar el salto de la barra de direcciones en Safari y el color de fondo exacto de ajustes de iOS (#F2F2F7) -->
<body class="h-[100dvh] bg-[#F2F2F7] text-slate-900 flex flex-col font-sans select-none antialiased overflow-hidden">

  <!-- ==================== HEADER NATIVO (Translucido con Blur) ==================== -->
  <!-- padding-top env(safe-area-inset-top) empuja el contenido por debajo del notch/reloj -->
  <header class="bg-white/80 backdrop-blur-xl border-b border-slate-200/60 px-4 pt-[max(env(safe-area-inset-top),16px)] pb-3 flex items-center justify-between z-40 flex-shrink-0">
    <div class="flex items-center gap-3">
      <button id="btn-toggle-menu" class="cursor-pointer p-2 -ml-2 rounded-full active:opacity-50 transition-opacity text-rose-600 flex items-center justify-center" aria-label="Abrir catálogo">
        <i data-lucide="menu" class="w-6 h-6 pointer-events-none"></i>
      </button>
      <div class="flex flex-col">
        <h1 class="text-lg font-bold tracking-tight text-slate-900 leading-tight">聞く日本語</h1>
        <p id="current-badge" class="text-[11px] text-slate-500 font-medium uppercase tracking-wider">Iniciando...</p>
      </div>
    </div>
  </header>

  <!-- ==================== ÁREA PRINCIPAL ==================== -->
  <main class="flex-1 overflow-y-auto px-4 md:px-8 pt-6 pb-[calc(env(safe-area-inset-bottom)+32px)] flex justify-center">
    <div class="w-full max-w-2xl flex flex-col gap-6">

      <!-- TARJETA DEL REPRODUCTOR (Estilo Apple Music/Podcasts) -->
      <section class="bg-white rounded-[28px] p-6 ios-shadow border border-slate-100 flex flex-col gap-6">
        
        <!-- Cabecera de la lección -->
        <div class="flex flex-col gap-1.5">
          <div class="flex items-center gap-2">
            <span id="label-category" class="text-[11px] font-bold text-rose-500 tracking-wider uppercase">Cargando...</span>
            <span class="text-slate-200">•</span>
            <span id="label-difficulty" class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-600">--</span>
          </div>
          <h2 id="conv-title" class="text-2xl font-bold text-slate-900 leading-snug tracking-tight">Conectando...</h2>
        </div>

        <!-- Panel de Control Auditivo -->
        <div class="bg-slate-50/80 rounded-2xl p-5 ios-card-shadow border border-slate-100 flex flex-col gap-5">
          <div class="flex items-center justify-between">
            <span id="audio-status" class="text-xs font-semibold text-slate-500 flex items-center gap-2">
              <span id="status-indicator" class="w-2.5 h-2.5 rounded-full bg-slate-300 inline-block"></span>
              Listo
            </span>

            <!-- Selector de Velocidad (Segmented Control iOS) -->
            <div class="flex items-center bg-[#E3E3E8] rounded-lg p-0.5">
              <button data-speed="0.75" class="btn-speed cursor-pointer text-[11px] px-3 py-1.5 rounded-md font-semibold text-slate-600 active:opacity-70 transition-opacity">0.75x</button>
              <button data-speed="1.0" class="btn-speed cursor-pointer text-[11px] px-3 py-1.5 rounded-md font-semibold bg-white text-slate-900 shadow-sm">1.0x</button>
              <button data-speed="1.25" class="btn-speed cursor-pointer text-[11px] px-3 py-1.5 rounded-md font-semibold text-slate-600 active:opacity-70 transition-opacity">1.25x</button>
            </div>
          </div>

          <!-- Botones de Reproducción principales -->
          <div class="flex items-center gap-4">
            <button id="btn-play-audio" class="cursor-pointer flex-1 py-4 px-6 rounded-2xl bg-rose-500 active:bg-rose-600 active:scale-[0.98] text-white font-bold flex items-center justify-center gap-3 shadow-[0_4px_14px_rgba(225,29,72,0.3)] transition-all text-base">
              <span id="play-icon-wrapper" class="flex items-center justify-center pointer-events-none">
                <i data-lucide="play" class="w-6 h-6 fill-current"></i>
              </span>
              <span id="btn-play-text">Escuchar</span>
            </button>
            <button id="btn-stop-audio" class="cursor-pointer p-4 rounded-2xl bg-slate-200 active:bg-slate-300 active:scale-[0.95] text-slate-600 transition-all" title="Detener">
              <i data-lucide="square" class="w-6 h-6 fill-current pointer-events-none"></i>
            </button>
          </div>

          <!-- Indicador de interlocutor -->
          <div id="speaker-display" class="hidden text-sm bg-white p-3.5 rounded-xl text-rose-600 font-medium flex items-center justify-between ios-card-shadow border border-rose-100">
            <span class="flex items-center gap-2.5">
              <i data-lucide="volume-2" class="w-4 h-4 animate-pulse pointer-events-none"></i>
              <strong id="current-speaker" class="font-bold tracking-tight">Interlocutor</strong>
            </span>
            <span id="audio-progress-step" class="text-[11px] bg-rose-50 text-rose-500 px-2 py-1 rounded font-mono font-bold">1/5</span>
          </div>
        </div>

        <!-- Transcripción y Controles -->
        <div class="border-t border-slate-100 pt-5 flex flex-col gap-4">
          <div class="flex items-center justify-between">
            <button id="btn-toggle-transcript" class="cursor-pointer text-[13px] font-semibold text-rose-500 active:opacity-50 flex items-center gap-1.5 transition-opacity">
              <i data-lucide="book-open" class="w-4 h-4 pointer-events-none"></i>
              <span id="transcript-toggle-text">Ver Transcripción</span>
            </button>

            <!-- Switches iOS style text -->
            <div id="transcript-controls" class="hidden items-center gap-4">
              <label class="flex items-center gap-2 cursor-pointer text-[13px] font-medium text-slate-600 active:opacity-70">
                <input type="checkbox" id="check-furigana" checked class="w-4 h-4 rounded text-rose-500 accent-rose-500 focus:ring-0">
                <span>Furigana</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer text-[13px] font-medium text-slate-600 active:opacity-70">
                <input type="checkbox" id="check-translation" checked class="w-4 h-4 rounded text-rose-500 accent-rose-500 focus:ring-0">
                <span>Español</span>
              </label>
            </div>
          </div>

          <div id="transcript-box" class="hidden p-5 bg-[#F8F8FA] rounded-2xl border border-slate-100 text-[15px] space-y-4"></div>
        </div>
      </section>

      <!-- SECCIÓN PREGUNTAS -->
      <section class="flex flex-col gap-4 mt-2">
        <div class="flex items-center justify-between px-2">
          <h3 class="text-[17px] font-bold text-slate-900 tracking-tight flex items-center gap-2">
            Preguntas
          </h3>
          <span id="score-counter" class="text-[11px] font-bold px-3 py-1 bg-slate-200/70 rounded-full text-slate-600">
            0 / 0
          </span>
        </div>

        <div id="questions-container" class="space-y-4"></div>
      </section>

    </div>
  </main>

  <!-- ==================== CATÁLOGO LATERAL (Slide Over Modal iPad/iOS) ==================== -->
  <div id="menu-drawer" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden transition-opacity">
    <div class="absolute inset-y-0 left-0 w-[85%] max-w-sm bg-white shadow-2xl flex flex-col rounded-r-3xl overflow-hidden">
      
      <!-- Cabecera Drawer -->
      <div class="pt-[max(env(safe-area-inset-top),20px)] px-5 pb-4 border-b border-slate-100 bg-white/90 backdrop-blur-md z-10 flex items-center justify-between">
        <div>
          <h2 class="font-bold text-slate-900 text-[17px] tracking-tight">Catálogo</h2>
          <p id="total-convs-counter" class="text-[11px] text-slate-500 mt-0.5">Cargando...</p>
        </div>
        <button id="btn-close-menu" class="cursor-pointer p-2 rounded-full bg-slate-100 active:bg-slate-200 text-slate-500 flex items-center justify-center transition-colors">
          <i data-lucide="x" class="w-5 h-5 pointer-events-none"></i>
        </button>
      </div>

      <!-- Buscador -->
      <div class="p-4 bg-white z-10 border-b border-slate-50">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400 pointer-events-none"></i>
          <input type="text" id="search-input" placeholder="Buscar diálogo..." class="w-full pl-10 pr-4 py-2.5 bg-[#F2F2F7] rounded-xl text-[15px] focus:outline-none focus:ring-2 focus:ring-rose-500/50 transition-shadow placeholder:text-slate-400">
        </div>
      </div>

      <!-- Lista de Diálogos -->
      <div id="dialogues-tree" class="flex-1 overflow-y-auto px-4 py-2 space-y-3 pb-[calc(env(safe-area-inset-bottom)+20px)] bg-white"></div>
    </div>
  </div>

  <script type="module" src="./js/main.js?v=1.0.3"></script>
</body>
</html>
